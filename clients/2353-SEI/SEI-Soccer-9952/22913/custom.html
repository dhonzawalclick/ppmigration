<script>
/**
 * SEI 9952 / Grow 22913 — Custom JavaScript (single paste for Customize).
 *
 * 1) Hide T&C + Sign up while fromOnLoad is false.
 *    Companion CSS: .xCustomClass-sei-hide-cta on policy/submit modules.
 * 2) Dual submit path (shared form):
 *    - Sign up  → params.sei_action = preference_center
 *    - Unsubscribe (#unsub_btn) → params.sei_action = unsubscribe, then form submit
 *
 * Name first/last On Load: do NOT fix in JS. Same as 9958 — remove the Name
 * module display condition in Page Builder; hide with CSS (.xName) until
 * fromOnLoad=true. See theme.css / README.
 *
 * uid / email / fromOnLoad come from the On Load integration (server-side
 * decrypt). Do not put encryptionKey / AES in this script.
 */
NGX.api('event:listen', 'page:ready', function () {
  var POLICY_ID = 'policy_1790353974879';
  var SUBMIT_ID = 'submit_1684917530454';
  var RADIO_ID = 'radio_1784640642802';
  var HIDE_CLASS = 'sei-hide-cta';
  var ACTION_PREFS = 'preference_center';
  var ACTION_UNSUB = 'unsubscribe';

  var pendingAction = ACTION_PREFS;

  function isFromOnLoadFalse() {
    var checked = document.querySelector('input[name="fromOnLoad"]:checked');
    return !checked || String(checked.value).toLowerCase() === 'false';
  }

  function syncCtaVisibility() {
    var method = isFromOnLoadFalse()
      ? 'module:add:custom:classes'
      : 'module:remove:custom:classes';
    NGX.api(method, { id: POLICY_ID, customClassNames: HIDE_CLASS });
    NGX.api(method, { id: SUBMIT_ID, customClassNames: HIDE_CLASS });
  }

  function setSubmitAction(action) {
    pendingAction = action;
    NGX.api('form:add:data', { name: 'sei_action', value: action });
    NGX.api('form:set:hidden:field', { name: 'sei_action', value: action });
  }

  function readUnsubEmail() {
    var removeme = document.querySelector('input[name="removeme"]');
    if (removeme && removeme.value) return String(removeme.value).trim();
    var input = document.querySelector(
      '.xComponent.xHtml input[type="email"], .xComponent.xHtml input[name="unsub_email"]'
    );
    return input && input.value ? String(input.value).trim() : '';
  }

  function triggerGrowSubmit() {
    var cta = document.querySelector('#xSubmitContainer .xButton');
    if (cta) {
      cta.click();
      return;
    }
    try {
      NGX.api('form:submit');
    } catch (err) {
      console.warn('[sei] could not trigger Grow submit', err);
    }
  }

  function onUnsubscribeClick(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }

    var email = readUnsubEmail();
    if (!email) {
      alert('Email is required to unsubscribe.');
      return;
    }

    NGX.api('form:set:field', { name: 'email', value: email });
    setSubmitAction(ACTION_UNSUB);
    triggerGrowSubmit();
  }

  function bindUnsubscribeButton() {
    var btn =
      document.querySelector('#unsub_btn') ||
      document.querySelector('#sei-unsub-btn');
    if (!btn || btn.getAttribute('data-sei-unsub-bound') === '1') return;
    btn.setAttribute('data-sei-unsub-bound', '1');
    btn.addEventListener('click', onUnsubscribeClick, true);
  }

  var submitCta = document.querySelector('#xSubmitContainer .xButton');
  if (submitCta) {
    submitCta.addEventListener(
      'click',
      function () {
        setSubmitAction(ACTION_PREFS);
      },
      true
    );
  }

  NGX.api('form:add:submitHandler', {
    id: 'seiDualPathAction',
    handler: function () {
      setSubmitAction(pendingAction || ACTION_PREFS);

      if (pendingAction === ACTION_UNSUB) {
        var email = readUnsubEmail();
        if (email) {
          NGX.api('form:set:field', { name: 'email', value: email });
        }
        return true;
      }

      return true;
    }
  });

  syncCtaVisibility();
  bindUnsubscribeButton();

  NGX.api('event:listen', 'module:component:didupdate', function (e) {
    if (e && e.id === RADIO_ID) syncCtaVisibility();
  });

  NGX.api('event:listen', 'form:ready', function () {
    bindUnsubscribeButton();
  });

  document.addEventListener(
    'change',
    function (e) {
      if (e.target && e.target.name === 'fromOnLoad') syncCtaVisibility();
    },
    true
  );
});
</script>
