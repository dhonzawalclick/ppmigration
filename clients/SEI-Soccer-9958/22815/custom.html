<script>
/**
 * SEI 9958 — Custom JavaScript (single paste for Customize).
 *
 * Hide T&C + Sign up while fromOnLoad is false.
 * Companion CSS: .xCustomClass-sei-hide-cta on policy/submit modules.
 *
 * uid / email / fromOnLoad come from the On Load integration (server-side
 * decrypt). Do not put encryptionKey / AES in this script.
 *
 * Name is one conditional module. Grow keeps a single prefilled value per
 * module while it is hidden, so name_Lastname replaces name_Firstname.
 * Month options are "1"–"12"; "02" does not match February. Re-apply both
 * from the On Load response after the module opens.
 */
(function () {
  var pending = null;

  function applyOnLoadFields(data) {
    if (!data || !NGX || !NGX.api) return;
    if (data.name_Firstname) {
      NGX.api('form:set:field', { name: 'name_Firstname', value: String(data.name_Firstname) });
    }
    if (data.date_of_birth_Month) {
      var month = String(parseInt(data.date_of_birth_Month, 10));
      if (month && month !== 'NaN') {
        NGX.api('form:set:field', { name: 'date_of_birth_Month', value: month });
      }
    }
  }

  var origOpen = XMLHttpRequest.prototype.open;
  var origSend = XMLHttpRequest.prototype.send;
  XMLHttpRequest.prototype.open = function (method, url) {
    this.__seiUrl = url;
    return origOpen.apply(this, arguments);
  };
  XMLHttpRequest.prototype.send = function () {
    this.addEventListener('load', function () {
      if (String(this.__seiUrl || '').indexOf('/onload') === -1) return;
      try {
        var body = JSON.parse(this.responseText || '{}');
        pending = body && body.data;
        applyOnLoadFields(pending);
        setTimeout(function () { applyOnLoadFields(pending); }, 300);
      } catch (e) {}
    });
    return origSend.apply(this, arguments);
  };

  window.__seiApplyOnLoadFields = function () { applyOnLoadFields(pending); };
})();

NGX.api('event:listen', 'page:ready', function () {
  var POLICY_ID = 'policy_1790353974879';
  var SUBMIT_ID = 'submit_1684917530454';
  var RADIO_ID = 'radio_1784640642802';
  var HIDE_CLASS = 'sei-hide-cta';

  function isFromOnLoadFalse() {
    var checked = document.querySelector('input[name="fromOnLoad"]:checked');
    return !checked || String(checked.value).toLowerCase() === 'false';
  }

  function syncCtaVisibility() {
    var method = isFromOnLoadFalse()
      ? 'module:add:custom:classes'
      : 'module:remove:custom:classes';
    NGX.api(method, { id: POLICY_ID, customClassNames: HIDE_CLASS });
    NGX.api(method, { id: SUBMIT_ID, customClassNames: HIDE_CLASS });
  }

  function syncPlaceholders() {
    document
      .querySelectorAll(
        '.xForm .xComponent.xName input, .xForm .xComponent.xEmail input, .xForm .xComponent.xDate_of_birth input'
      )
      .forEach(function (input) {
        var field = input.closest('.xField') || input.parentElement;
        if (!field) return;
        if (String(input.value || '').trim()) {
          field.classList.add('sei-filled');
        } else {
          field.classList.remove('sei-filled');
        }
      });
  }

  syncCtaVisibility();
  syncPlaceholders();
  if (window.__seiApplyOnLoadFields) {
    window.__seiApplyOnLoadFields();
    setTimeout(window.__seiApplyOnLoadFields, 300);
  }
  setTimeout(syncPlaceholders, 300);
  setTimeout(syncPlaceholders, 1000);

  // On Load fills fromOnLoad after page:ready; re-sync when the radio updates
  NGX.api('event:listen', 'module:component:didupdate', function (e) {
    if (e && e.id === RADIO_ID) syncCtaVisibility();
    syncPlaceholders();
  });

  document.addEventListener(
    'change',
    function (e) {
      if (e.target && e.target.name === 'fromOnLoad') syncCtaVisibility();
      syncPlaceholders();
    },
    true
  );

  document.addEventListener('input', syncPlaceholders, true);
  document.addEventListener('blur', syncPlaceholders, true);
});
</script>
